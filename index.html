<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="Happy Birthday Mosina 💖">
    <meta name="description" content="A cinematic, multi-screen birthday journey created especially for Mosina.">

    <title>Happy Birthday Mosina 💖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;500;600;700&family=Caveat:wght@600;700&family=Titan+One&family=Sriracha&display=swap"
        rel="stylesheet">
</head>

<body data-state="birthday">
    <!-- Floating Background Music Controller (Persistent across all screens - Default ON) -->
    <button id="music-toggle-btn" class="floating-music-btn playing" aria-label="Pause background music" type="button">
        <i id="music-icon" class="fa-solid fa-volume-high"></i>
        <span id="music-label" class="music-tooltip">Music On</span>
        <span class="music-wave-bars">
            <span></span><span></span><span></span>
        </span>
    </button>

    <!-- SPA Root Container: Only ONE screen mounted dynamically at any given time -->
    <main id="app" role="main"></main>

    <!-- Application Script -->
    <script src="js/script.js"></script>
</body>

</html>
